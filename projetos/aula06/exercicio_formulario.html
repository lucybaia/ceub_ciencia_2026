<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <main>
        <section id="formulário" class="py-5">
            <div class="container">
                <h1>Inscrição / Contato</h1>
                Preencha os campos abaixo. Campos marcados com * são obrigatórios.
            </div>

            <form action="" method="post" class="bg-white border rounded-4 shadow-sm p-4 p-md-5">
                <div class="row g-4">
                    <div class="col-md-6">
                        <label for="nome" class="form-label">Nome *</label>
                        <input type="text" class="form-control" id="nome" placeholder="João">
                    </div>
                    <div class="col-md-6">
                        <label for="sobrenome" class="form-label">Sobrenome *</label>
                        <input type="text" class="form-control" id="sobrenome" placeholder="Silva">
                    </div>
                </div>

                <div class="row g-4 mt-0">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email *</label>
                        <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com">
                    </div>
                    <div class="col-md-6">
                        <label for="telefone" class="form-label">Telefone</label>
                        <input type="text" class="form-control" id="telefone" placeholder="(11) 91234-5678">
                    </div>
                </div>

                <div class="row g-4 mt-0">
                    <div class="col-md-6">
                        <label for="cpf" class="form-label">CPF *</label>
                        <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00">
                    </div>
                    <div class="col-md-6">
                        <label for="nascimento" class="form-label">Data de nascimento</label>
                        <input type="date" class="form-control" id="nascimento">
                    </div>
                </div>

                <div class="row g-4 mt-0">
                    <div class="col-md-6">
                        <label for="senha" class="form-label">Senha *</label>
                        <input type="password" class="form-control" id="senha" placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="col-md-6">
                        <label for="funcao" class="form-label">Função</label>
                        <select class="form-select" id="funcao" aria-label="Função">
                            <option selected>Escolha...</option>
                            <option value="1">Repositor</option>
                            <option value="2">Caixa</option>
                            <option value="3">Açougue</option>
                        </select>
                    </div>
                </div>

                <div class="row g-4 mt-0">
                    <div class="col-md-12">
                        <label for="usuario" class="form-label">Usuário</label>
                        <div class="input-group">
                            <span class="input-group-text">@</span>
                            <input type="text" class="form-control" id="usuario" placeholder="nomeusuario">
                        </div>
                    </div>
                </div>

                <div class="mb-3 mt-4">
                    <label for="exampleFormControlTextarea1" class="form-label">Mensagem</label>
                    <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                        placeholder="Escreva aqui..."></textarea>
                </div>

                <div class="mb-3">
                    <label for="formFile" class="form-label">Upload de Currículo (PDF)</label>
                    <input class="form-control" type="file" id="formFile" accept=".pdf">
                    <div class="form-text">Máx. 5MB. Apenas PDF.</div>
                </div>

                <div class="mb-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                        <label class="form-check-label" for="radioDefault1">
                            Quero receber novidades
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                        <label class="form-check-label" for="radioDefault2">
                            Contato por email
                        </label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault3">
                        <label class="form-check-label" for="radioDefault3">
                            Contato por telefone
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">Enviar</button>
                <button type="reset" class="btn btn-outline-dark">Limpar</button>
            </form>
        </section>
    </main>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
